name: DontWakeTheIsland

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Must be unique on Apple's side: replace "com.example" with your own reverse domain.
    # The widget uses "<APP_BUNDLE_ID>.widget". CI can override it: APP_BUNDLE_ID=... on the xcodebuild line.
    APP_BUNDLE_ID: com.example.dontwaketheisland
    # Set your team here (or in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""

targets:
  DontWakeTheIsland:
    type: application
    platform: iOS
    scheme:
      gatherCoverageData: false
    sources:
      - path: DontWakeTheIsland
        excludes:
          - "DynamicIsland/IslandLiveActivity.swift"
          - "DynamicIsland/IslandWidgetBundle.swift"
          - "**/.gitkeep"
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: "Don't Wake"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        CADisableMinimumFrameDurationOnPhone: true
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes:
              - dontwaketheisland
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: IslandWidgetExtension
        embed: true

  IslandWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DontWakeTheIsland/DynamicIsland/IslandAttributes.swift
      - path: DontWakeTheIsland/DynamicIsland/IslandLiveActivity.swift
      - path: DontWakeTheIsland/DynamicIsland/IslandWidgetBundle.swift
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: "Don't Wake Island"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
