name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Envoyer la build sur TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilation (simulateur, sans signature)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Installer XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler
        run: |
          set -o pipefail
          xcodebuild build \
            -project DontWakeTheIsland.xcodeproj \
            -scheme DontWakeTheIsland \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | xcbeautify --renderer github-actions

      - name: Extraire les erreurs
        if: failure()
        run: grep -E "error:|warning:" build.log | sort -u > errors.txt || true

      - name: Publier le journal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            errors.txt
            build.log

  testflight:
    name: Envoi sur TestFlight
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    env:
      KEY_PATH: ${{ github.workspace }}/private_keys/AuthKey.p8
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Installer XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Installer la clé App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"

      - name: Archiver (signature automatique)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DontWakeTheIsland.xcodeproj \
            -scheme DontWakeTheIsland \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/DontWakeTheIsland.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            APP_BUNDLE_ID="${{ secrets.APP_BUNDLE_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | xcbeautify

      - name: Exporter et envoyer sur App Store Connect
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/DontWakeTheIsland.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            2>&1 | xcbeautify

      - name: Supprimer la clé
        if: always()
        run: rm -f "$KEY_PATH"
